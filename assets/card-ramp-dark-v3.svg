<text x="28" y="44" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" letter-spacing="1" fill="#A8A8A8">01 / DESIGN SYSTEM</text>
<text x="28" y="94" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" letter-spacing="-1" fill="#F5F2EA">One red, ten stops</text>
